<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>

	<style>
		.scroll-table-container th,
		.scroll-table-container td {
			padding: 8px 4px !important;
			vertical-align: middle !important;
		}
	</style>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">

				<div class="scroll-table-container" style="height: 600px; width: 100%; overflow-y: auto;">
					<table class="table table-hover dataTable no-footer">
						<thead>
							<tr>
								<th class="w140">日付</th>
								<th class="w140">コース内容</th>
								<th class="60"></th>
								<th class="w180">出勤</th>
								<th class="w180">退勤</th>
								<th class="w90">中抜け時間</th>
								<th class="w90">ステータス</th>
								<th class="w140">備考</th>
							</tr>
	   </thead>
	<tbody>


	<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
		<tr>
			<th:block>
						<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"th:value="${dailyAttendanceForm.isToday}" />
						<input type="hidden"th:name="|attendanceList[${stat.index}].studentAttendanceId|"th:value="${dailyAttendanceForm.studentAttendanceId}" />
						<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"th:value="${dailyAttendanceForm.trainingDate}" />
						<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"th:value="${dailyAttendanceForm.dispTrainingDate}" />
						<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"th:value="${dailyAttendanceForm.sectionName}" />
						<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"th:value="${dailyAttendanceForm.statusDispName}" />
			</th:block>
						<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
						<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>


				<!--Task.28 定時ボタンの追加-->

						<td class="w60">
						<button type="button" id="button" class="btn btn-success default-button"th:value="${stat.index}">定時</button>
							</td>

							<td class="w180">
							<div style="display: flex; align-items: center; gap: 4px;">

				<!-- 【出勤：時】のプルダウン -->
							<select th:id="|startHour${stat.index}|"th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
							class="form-control input-sm"style="width: 65px; display: inline-block;">
							<option th:each="hour : ${attendanceForm.hourMap}"th:value="${hour.key}"th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">
									[[${hour.value}]]</option>
							</select>
					<span>：</span>
				<!-- 【出勤：分】のプルダウン -->
							<select th:id="|startMinute${stat.index}|"th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
							class="form-control input-sm"style="width: 65px; display: inline-block;">
							<option th:each="minute : ${attendanceForm.minuteMap}"th:value="${minute.key}"th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">
									[[${minute.value}]]</option>
							</select>
				</div>
						</td>


						<td class="w180">
					<div style="display: flex; align-items: center; gap: 4px;">
				<!--【退勤:時】のプルダウン -->
							<select th:id="|endHour${stat.index}|"th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
								class="form-control input-sm"style="width: 65px; display: inline-block;">
							<option th:each="hour : ${attendanceForm.hourMap}"th:value="${hour.key}"th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">
													[[${hour.value}]]</option>
							</select>
				   <span> : </span>

				<!--【退勤:分】のプルダウン -->
							<select th:id="|endMinute${stat.index}|"th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
									class="form-control input-sm"style="width: 65px; display: inline-block;">
							<option th:each="minute : ${attendanceForm.minuteMap}"th:value="${minute.key}"th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">
											        [[${minute.value}]]</option>
							</select>
					</div>
				</td>
				
				<!-- 【中抜け時間】のプルダウン-->
							<td class="w90">
							<select th:name="|attendanceList[${stat.index}].blankTime|"class="form-control">
							<option th:each="blankTime : ${attendanceForm.blankTimes}"th:value="${blankTime.key}" th:inlne="text" class="form-control"th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
												[[${blankTime.value}]]</option>
							</select>
						</td>
						<td class="w90">[[${dailyAttendanceForm.statusDispName}]]</td>
						<td class="w140">
							
				            <input type="text" th:name="|attendanceList[${stat.index}].note|"th:value="${dailyAttendanceForm.note}" class="form-control"></input>
						 </td>
			 		 </tr>
			 </th:block>
		 </tbody>
	 </table>
 </div>
		<div class="form-group">
			<th:block th:if="${session.loginUserDto.role == '0001'}">
				<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
			</th:block>
			
			<th:block th:if="${session.loginUserDto.role != '0001'}">
		<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
		    </th:block>
		    
			<input type="submit" value="更新" name="complete" class="btn btn-info" />
	</div>

		 </form>
	  </div>
	</div>
	<!--Task.28の定時ボタン押下時の設定-->
	<script>
		$(function () {
			$('.default-button').click(function () {
				const index = $(this).val();
				$('#startHour' + index).val(9);
				$('#startMinute' + index).val(0);
				$('#endHour' + index).val(18);
				$('#endMinute' + index).val(0);
			});
		});
	</script>


</body>

</html>
